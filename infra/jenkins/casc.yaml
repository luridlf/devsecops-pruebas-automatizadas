jenkins:
  systemMessage: "DevSecOps - OCY1102 Ciberseguridad en desarrollo (Duoc UC)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          # Configuración de OWASP ZAP (escaneo dinámico ejecutado en Docker)
          - key: "ZAP_IMAGE"
            value: "zaproxy/zap-stable"
          - key: "ZAP_TARGET_URL"
            value: "http://vulnerable-app:5000/hello?name=test"
          - key: "DOCKER_NETWORK"
            value: "devsecops"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              id: "sonar-token"
              description: "Token de análisis de SonarQube"
              secret: "${SONAR_TOKEN}"
          - string:
              id: "nvd-api-key"
              description: "API key de NVD para OWASP Dependency-Check"
              secret: "${NVD_API_KEY:-sin-key}"

unclassified:
  location:
    url: "http://localhost:8080/"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"

tool:
  sonarRunnerInstallation:
    installations:
      - name: "SonarScanner"
        properties:
          - installSource:
              installers:
                - sonarRunnerInstaller:
                    id: "8.3.0.16463"
  dependency-check:
    installations:
      - name: "DependencyCheck"
        properties:
          - installSource:
              installers:
                - dependencyCheckInstaller:
                    id: "13.0.0"

jobs:
  - script: >
      pipelineJob('devsecops-pipeline') {
        description('Pipeline DevSecOps: Build, Test, Analyze (SonarQube), Deploy y Security Test (Dependency-Check + ZAP)')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/luridlf/devsecops-pruebas-automatizadas.git') }
                branch('*/feature/pipeline-devsecops')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
